    <!-- Set initial theme before React loads to prevent flash -->
    <script>
      (function() {
        const stored = localStorage.getItem('portfolio-theme');
        const theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
        document.documentElement.classList.remove(theme === 'dark' ? 'light' : 'dark');
      })();
    </script>

    <script>
      (function(){
        function injectManifest(){
          try{
            var l = document.createElement('link');
            l.rel = 'manifest';
            l.href = '/manifest.json';
            document.head.appendChild(l);
          }catch(e){}
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(injectManifest, {timeout: 2000});
        } else {
          if (document.readyState === 'complete') injectManifest();
          else window.addEventListener('load', injectManifest, {once:true});
        }
      })();
    </script>

    <!-- Defer non-critical structured data injection to idle time to avoid parse cost -->
    <script>
      (function(){
        function injectNonCriticalJSONLD(){
          try{
            var s = document.createElement('script');
            s.type = 'application/ld+json';
            s.text = JSON.stringify({
              "@context": "https://schema.org",
              "@type": "WebSite",
              "name": "Ahmed Mostafa Portfolio",
              "url": "https://ahmedmostafa-swe.tech"
            });
            document.head.appendChild(s);
          }catch(e){}
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(injectNonCriticalJSONLD, {timeout: 3000});
        } else {
          window.addEventListener('load', injectNonCriticalJSONLD, {once:true});
        }
      })();
    </script>
    
    <!-- Google Fonts - Direct load with display=swap for performance -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700;800&family=Syne:wght@400;500;600;700;800&display=swap"></noscript>
    <!-- Optimize font loading to reduce visible flash -->
    <script>
      (function() {
        // Use fonts.ready API for fastest font load detection
        if ('fonts' in document && document.fonts.ready) {
          document.fonts.ready.then(function() {
            document.documentElement.classList.add('fonts-loaded');
          });
        } else if ('fonts' in document) {
          // Fallback: load critical fonts explicitly
          Promise.all([
            document.fonts.load('700 1em "Syne"'),
            document.fonts.load('400 1em "Outfit"')
          ]).then(function() {
            document.documentElement.classList.add('fonts-loaded');
          }).catch(function() {
            // Ensure class is added even if fonts fail
            setTimeout(function() {
              document.documentElement.classList.add('fonts-loaded');
            }, 200);
          });
        } else {
          // Fallback for older browsers
          setTimeout(function() {
            document.documentElement.classList.add('fonts-loaded');
          }, 500);
        }
      })();
    </script>
